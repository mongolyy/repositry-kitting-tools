name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq shellcheck

      - name: Check shell syntax
        run: bash -n setup-repo.sh

      - name: Run shellcheck
        run: shellcheck setup-repo.sh test/stubs/gh

      - name: Run tests
        run: bats test/
